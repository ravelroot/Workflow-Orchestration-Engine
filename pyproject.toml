[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delco"
version = "1.1.0"
description = "Motor de orquestração de workflows: pipelines como código, agendamento, fila com workers, retentativas e retomada após falhas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Erik Pimenta" }]
dependencies = [
  "django>=6.1,<6.2",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "drf-spectacular-sidecar>=2025.1",
  "channels>=4.2,<5",
  "daphne>=4.1,<5",
  "whitenoise>=6.8,<7",
  "mysqlclient>=2.2.1,<3",
  "redis>=5.2,<9",
  "croniter>=5,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
delco = "delco.cli:main"

[tool.setuptools.packages.find]
include = ["delco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --cov=delco --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning:croniter"]
markers = ["nodb: teste de unidade que não precisa de MySQL nem Redis"]

[tool.coverage.run]
omit = ["delco/__main__.py", "delco/asgi.py", "delco/wsgi.py", "delco/migrations/*", "delco/management/*", "tests/*"]
concurrency = ["thread", "multiprocessing"]
parallel = true
sigterm = true

[tool.ruff]
line-length = 110
target-version = "py312"
