name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/atividade.txt"
  pull_request:
  schedule:
    - cron: "53 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Python · pytest
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: delco
          MYSQL_PASSWORD: delco
          MYSQL_DATABASE: delco_test
          MYSQL_ROOT_PASSWORD: delco
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -udelco -pdelco --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DELCO_TEST_DATABASE_URL: mysql://delco:delco@127.0.0.1:3306/delco_test
      DELCO_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Biblioteca cliente do MySQL (para compilar o mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libmysqlclient-dev
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Painel · sintaxe do JavaScript
        run: for f in web/js/*.js web/js/pages/*.js; do node --check "$f"; done
      - run: delco validate workflows
      - name: Workflows de exemplo rodando localmente
        run: |
          delco dev run ola_delco --quiet
          delco dev run relatorio_vendas_diario --quiet -p pasta_saida=/tmp/delco-ci
      - run: python manage.py check
        env:
          DELCO_DATABASE_URL: mysql://delco:delco@127.0.0.1:3306/delco_test
      - run: python manage.py makemigrations --check --dry-run
        env:
          DELCO_DATABASE_URL: mysql://delco:delco@127.0.0.1:3306/delco_test
      - run: python -m pytest --cov-report=xml

  docker:
    name: Docker · imagem
    runs-on: ubuntu-24.04
    needs: testes
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
      - name: Imagem responde aos comandos
        run: |
          docker run --rm delco:1.2.0 delco --version
          docker run --rm delco:1.2.0 delco validate workflows
          docker run --rm delco:1.2.0 delco dev run ola_delco --quiet
